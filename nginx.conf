server {
    listen 80;
    server_name localhost;

    # Dynamic DNS resolver so Nginx starts up without requiring backend host to exist immediately
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    set $backend_upstream "http://backend:5000";

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API endpoints to backend service (evaluated dynamically at request time)
    location ~ ^/(feedback|syllabus|enroll|health) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
